[package]
name = "nxfr-ffi"
version.workspace = true
edition.workspace = true
description = "C-ABI FFI bindings for the NXFR protocol, designed for JNI/Android use"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nxfr-common = { workspace = true }
nxfr-core = { workspace = true }
nxfr-crypto = { workspace = true }
nxfr-storage = { workspace = true }
nxfr-transport = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
log = { workspace = true }
jni = "0.21"
android_logger = "0.14"

[dev-dependencies]
tempfile = "3"
