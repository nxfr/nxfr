<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    NXFR Favicon — Ultra-bold simplified N mark on dark rounded background.
    Optimized for 16x16 / 32x32 browser tabs: thicker bars, no arrow tips,
    maximum legibility at small sizes.
  -->

  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="20" fill="#0F172A"/>

  <!-- Bold N mark -->
  <rect x="18" y="18" width="18" height="64" fill="#00E5FF"/>
  <rect x="64" y="18" width="18" height="64" fill="#00E5FF"/>
  <polygon points="18,18 36,18 82,82 64,82" fill="#00E5FF"/>
</svg>
