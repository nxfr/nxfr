<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept A: "Bracket Beam"
       Two angular brackets < > framing a square packet.
       Two peers opening a channel for data — the protocol in one glyph. -->
  <rect width="512" height="512" fill="#0B0F17"/>
  <!-- Left bracket (peer 1) -->
  <polyline points="182,136 94,256 182,376"
    fill="none" stroke="#F8FAFC" stroke-width="30"
    stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Right bracket (peer 2) -->
  <polyline points="330,136 418,256 330,376"
    fill="none" stroke="#F8FAFC" stroke-width="30"
    stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Packet in transit -->
  <rect x="234" y="234" width="44" height="44" fill="#00E5FF"/>
</svg>
