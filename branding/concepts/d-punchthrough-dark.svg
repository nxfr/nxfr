<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept D: "Punch-Through"
       A square frame with a diagonal beam cutting through it.
       Data punches through the node — nothing stops the transfer. -->
  <rect width="512" height="512" fill="#0B0F17"/>
  <!-- Node frame -->
  <rect x="148" y="148" width="216" height="216"
    fill="none" stroke="#F8FAFC" stroke-width="24" rx="2"/>
  <!-- Diagonal beam -->
  <line x1="100" y1="412" x2="412" y2="100"
    stroke="#00E5FF" stroke-width="24" stroke-linecap="square"/>
</svg>
