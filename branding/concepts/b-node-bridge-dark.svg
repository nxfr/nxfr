<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept B: "Node Bridge"
       Two outlined square nodes connected by a solid beam.
       Peer-to-peer made literal — two endpoints, one direct link. -->
  <rect width="512" height="512" fill="#0B0F17"/>
  <!-- Left node -->
  <rect x="96" y="212" width="88" height="88"
    fill="none" stroke="#F8FAFC" stroke-width="16" rx="2"/>
  <!-- Right node -->
  <rect x="328" y="212" width="88" height="88"
    fill="none" stroke="#F8FAFC" stroke-width="16" rx="2"/>
  <!-- Beam (direct connection) -->
  <rect x="184" y="244" width="144" height="24" fill="#00E5FF"/>
</svg>
