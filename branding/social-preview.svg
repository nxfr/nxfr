<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- NXFR Protocol — GitHub Social Preview (Bracket-Beam Production Mark) -->
  <rect width="1280" height="640" fill="#0B0F17"/>
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111827" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Left Header Panel -->
  <g transform="translate(100, 130)">
    <!-- Icon Mark (150x150 at x=0, y=10) -->
    <g transform="translate(0, 10) scale(0.29296875)">
      <polyline points="204,104 148,104 76,176 76,336 148,408 204,408"
        fill="none" stroke="#F8FAFC" stroke-width="48"
        stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4"/>
      <polyline points="308,104 364,104 436,176 436,336 364,408 308,408"
        fill="none" stroke="#F8FAFC" stroke-width="48"
        stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4"/>
      <rect x="116" y="232" width="34" height="48" fill="#F8FAFC"/>
      <rect x="164" y="232" width="34" height="48" fill="#F8FAFC"/>
      <rect x="214" y="214" width="84" height="84" fill="#00E5FF"/>
      <rect x="314" y="232" width="34" height="48" fill="#F8FAFC"/>
      <rect x="362" y="232" width="34" height="48" fill="#F8FAFC"/>
    </g>

    <!-- Wordmark & Tagline -->
    <text x="190" y="75" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="76" letter-spacing="6" fill="#F8FAFC">NXFR</text>
    <text x="194" y="120" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="18" letter-spacing="2" fill="#00E5FF">PEER-TO-PEER LAN PROTOCOL</text>
    <text x="194" y="160" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">No cloud. No accounts. Just math.</text>
  </g>

  <!-- Technical Spec Strip -->
  <g transform="translate(100, 420)">
    <rect width="1080" height="88" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    
    <text x="40" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">PORT</text>
    <text x="40" y="62" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#00E5FF">TCP 17394</text>

    <text x="220" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">CIPHER</text>
    <text x="220" y="62" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#F8FAFC">TLS 1.3 / X25519</text>

    <text x="450" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">OFF-GRID</text>
    <text x="450" y="62" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#F8FAFC">DESERT MODE (WFD)</text>

    <text x="730" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">ENGINE</text>
    <text x="730" y="62" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#00E5FF">RUST + TOKIO</text>

    <text x="940" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">LICENSE</text>
    <text x="940" y="62" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#F8FAFC">APACHE 2.0</text>
  </g>
</svg>