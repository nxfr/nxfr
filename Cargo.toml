[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.70"

[workspace.dependencies]
# Core
thiserror = "2"
ciborium = "0.2"
sha2 = "0.10"

# Crypto/TLS
rcgen = { version = "0.13", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
ring = "0.17"
x509-parser = "0.16"

# Async
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Discovery
mdns-sd = "0.11"
nix = { version = "0.29", features = ["fs"] }

# Internal
nxfr-common = { path = "crates/nxfr-common" }
nxfr-core = { path = "crates/nxfr-core" }
nxfr-crypto = { path = "crates/nxfr-crypto" }
nxfr-transport = { path = "crates/nxfr-transport" }
nxfr-storage = { path = "crates/nxfr-storage" }
nxfr-discovery = { path = "crates/nxfr-discovery" }

# Dev / Util
hex = "0.4"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
dialoguer = "0.11"
anyhow = "1"
zeroize = "1"

# Internal (for E2E tests)
nxfr-daemon = { path = "crates/nxfr-daemon" }
